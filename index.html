<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Logo 3D</title>

<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<style>
body{
    margin:0;
    background:#0b3d2e;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:Arial;
}

model-viewer{
    width:300px;
    height:300px;
}
</style>

</head>

<body>

<model-viewer
src="logo_3d_placeholder.glb"
auto-rotate
auto-rotate-delay="0"
rotation-per-second="30deg"
camera-controls
shadow-intensity="1"
exposure="1"
>

</model-viewer>

</body>
</html>
